services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: creatorops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creatorops}
      POSTGRES_DB: creatorops
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorops"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
