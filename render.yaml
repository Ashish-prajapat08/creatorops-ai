# ZERO-COST PERSONAL DEMO. Select a Free workspace and no paid add-ons.
# One API + solo Celery/Beat process tree; sleep pauses all background processing.
# PostgreSQL/Auth are supplied by your existing Supabase FREE project.
services:
  - type: web
    name: creatorops-demo
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: python -m app.deployment.free_demo
    healthCheckPath: /health/ready
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: TEST_MODE
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: AI_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: REDIS_URL
        fromService:
          name: creatorops-demo-redis
          type: keyvalue
          property: connectionString
  - type: keyvalue
    name: creatorops-demo-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
